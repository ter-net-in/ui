name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:registry
      - name: Verify generated registry is current
        run: git diff --exit-code -- apps/docs/public/r
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run --filter '@internet-ui/docs' build-storybook

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync project
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.next/' \
            --exclude='out/' \
            --exclude='storybook-static/' \
            --exclude='deploy/' \
            --exclude='.env' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:~/internet-ui/"
      - name: Build and export sites
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/internet-ui && docker compose build && docker compose run --rm ui && docker compose run --rm storybook"
